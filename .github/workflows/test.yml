name: 'test'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  go_test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - '"ubuntu-latest"'
          - '"macos-latest"'
          - '"windows-latest"'
    uses: 'abcxyz/actions/.github/workflows/go-test.yml@main' # ratchet:exclude
    with:
      runs-on: '${{ matrix.os }}'
